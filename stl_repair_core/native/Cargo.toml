[package]
name = "stl-repair-core-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Exact triangle-pair classification kernel for stl_repair_core"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py311", "extension-module"] }
numpy = "=0.29.0"
robust = "=1.2.0"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
